# Fails a push or pull request that would publish a credential or personal data.
#
# This repository is public. It has already carried employee documents and the
# database host in tracked files; none of that is caught at review time, so it
# is caught here. Scans the files as they stand (not history: the old weak
# .env.example defaults are known and burned). Enable GitHub secret scanning
# and push protection in the repository settings as well.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets in tracked files (gitleaks, values redacted)
        uses: docker://zricethezav/gitleaks:v8.18.4
        with:
          args: detect --no-git --source . --redact --verbose --exit-code 1

      - name: No environment, key or credential files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|id_rsa|service-account.*\.json$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked credential files:"; echo "$bad"; exit 1; fi

      - name: No uploaded personal documents tracked
        run: |
          bad=$(git ls-files uploads | grep -v '^uploads/assets/' || true)
          if [ -n "$bad" ]; then echo "Tracked user uploads (personal data):"; echo "$bad"; exit 1; fi
